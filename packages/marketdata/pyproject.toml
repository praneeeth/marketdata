[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketdata"
version = "0.2.0"
description = "India market data (NSE/BSE) from the user's own broker, plus global cues"
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketdata"]
