<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Candlewise">
  <title>Candlewise</title>
  <rect width="512" height="512" rx="112" fill="#1f2937"/>
  <g transform="translate(96 96) scale(10)">
    <!-- lower wick -->
    <line x1="16" y1="24" x2="16" y2="28.5" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/>
    <!-- candle body -->
    <rect x="11" y="13" width="10" height="11" rx="1.6" fill="#e2e8f0"/>
    <!-- upper wick rising into a small flame -->
    <line x1="16" y1="13" x2="16" y2="10.4" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M16 2.6 C17.9 4.9 18.6 6.4 18.6 7.8 A2.6 2.6 0 0 1 13.4 7.8 C13.4 6.4 14.1 4.9 16 2.6 Z" fill="#f59e0b"/>
    <path d="M16 5.6 C16.8 6.6 17.1 7.3 17.1 7.9 A1.1 1.1 0 0 1 14.9 7.9 C14.9 7.3 15.2 6.6 16 5.6 Z" fill="#fde68a"/>
  </g>
</svg>
