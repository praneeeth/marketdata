# pytest config
# Run all unit tests:      python -m pytest tests/ -v
# Run one file:            python -m pytest tests/test_notify_policy.py -v
# Really send notifications: python -m pytest tests/ -v --notify (off by default)
# Install the pre-push hook: bash scripts/install-hooks.sh
#
# India fork: lint, type and coverage checks apply to new code only (see
# docs/india-fork/PLAN.md §4.1). Add new modules to the lists below as they are written.

[project]
# Metadata only: the app is not installed as a package; the backend lives in src/.
name = "candlewise"
version = "0.0.0"
description = "Candlewise: a self-hosted, research-only AI assistant for Indian stocks. Read the market. Decide for yourself."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = [
    "src/platform/compliance/**/*.py",
    "src/platform/security/**/*.py",
    "src/platform/branding.py",
    "src/platform/persistence/legacy_db.py",
    "tests/test_candlewise_rename.py",
    "src/modules/administration/api/compliance.py",
    "src/modules/automation/research_output.py",
    "src/modules/automation/tradingagents/research_graph.py",
    "src/modules/market/brokers.py",
    "src/modules/market/api/brokers.py",
    "src/platform/marketdata/india_bridge.py",
    "src/modules/market/api/global_markets.py",
    "src/platform/marketdata/global_cues_service.py",
    "tests/test_india_bridge.py",
    "tests/test_india_stocks_api.py",
    "tests/test_global_markets_api.py",
    "tests/compliance/**/*.py",
    "tests/security/**/*.py",
    "packages/marketdata/src/marketdata/india/**/*.py",
    "packages/marketdata/src/marketdata/global_cues.py",
    "packages/marketdata/tests/india/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "RUF", "DTZ", "C4", "PT"]
ignore = [
    "RUF001",  # ambiguous unicode: the rules intentionally contain ₹ and CJK text
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"packages/*/tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "src/platform/compliance",
    "src/platform/security",
    "src/platform/branding.py",
    "src/platform/persistence/legacy_db.py",
    "src/modules/administration/api/compliance.py",
    "src/modules/automation/research_output.py",
    "src/modules/automation/tradingagents/research_graph.py",
    "src/modules/market/brokers.py",
    "src/modules/market/api/brokers.py",
    "src/platform/marketdata/india_bridge.py",
    "src/modules/market/api/global_markets.py",
    "src/platform/marketdata/global_cues_service.py",
    "packages/marketdata/src/marketdata/india",
    "packages/marketdata/src/marketdata/global_cues.py",
]
mypy_path = "packages/marketdata/src"
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
branch = true
# ``include`` (not ``source``) so single-file modules are measured too.
include = [
    "src/platform/compliance/*.py",
    "src/platform/security/*.py",
    "src/platform/branding.py",
    "src/platform/persistence/legacy_db.py",
    "src/modules/administration/api/compliance.py",
    "src/modules/automation/research_output.py",
    "src/modules/automation/tradingagents/research_graph.py",
    "src/modules/market/brokers.py",
    "src/modules/market/api/brokers.py",
    "src/platform/marketdata/india_bridge.py",
    "src/modules/market/api/global_markets.py",
    "src/platform/marketdata/global_cues_service.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
